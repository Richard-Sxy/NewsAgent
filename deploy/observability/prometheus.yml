global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: newsagent
    honor_labels: true
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
