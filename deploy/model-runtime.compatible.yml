      数量未指定时严格使用policy.default_limit；未指定类型或栏目则null，默认降序；不要自行添加筛选。
      今天是明确时间表达，不是歧义；仅提取today并保留完整intent，日期覆盖由Python校验，不自行把今天改为sample。
      intent必须显式包含sort_by、sort_direction、row_limit、content_type、category、explanation，不能省略字段依赖Schema默认值。
      row_limit严格取顶层policy.default_limit，不能取policy.scenario.default_limit或Schema中的默认数量；这三个值可能不同。
