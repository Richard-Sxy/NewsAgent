# Overlay order: native-e2e -> bge-snapshot -> bge-demo. Add
# timeline-query-model last when using the approved query-understanding model.
# This isolated project retains existing demonstration containers and volumes.
name: news-agent-bge-demo

x-bge-demo-warehouse: &bge-demo-warehouse
  SQL_ASSISTANT_DATASET_PROFILE: timeline-v4
  SQL_ASSISTANT_NEWS_PER_TENANT: "1200"
  SQL_ASSISTANT_SCENARIOS_PATH: /app/deploy/text2sql-scenes.timeline-v4.yml

services:
  postgres:
    ports: !override []
  temporal:
    ports: !override []
  minio:
    ports: !override []

  migrate:
    image: news-agent/writing-agent-service:bge-demo

  api:
    image: news-agent/writing-agent-service:bge-demo
    ports: !override ["127.0.0.1:${NEWSAGENT_BGE_API_PORT:-28060}:8000"]
    # The first start hashes/loads the local model and initializes the synthetic
    # warehouse. Allow that bounded initialization before counting failed probes.
    healthcheck:
      start_period: 300s
    environment:
      <<: *bge-demo-warehouse
    volumes:
      - ./text2sql-scenes.timeline-v4.yml:/app/deploy/text2sql-scenes.timeline-v4.yml:ro

  hot-news-worker:
    image: news-agent/writing-agent-service:bge-demo
    environment:
      <<: *bge-demo-warehouse
    volumes:
      - ./text2sql-scenes.timeline-v4.yml:/app/deploy/text2sql-scenes.timeline-v4.yml:ro

  writing-worker:
    image: news-agent/writing-agent-service:bge-demo

  outbox-worker:
    image: news-agent/writing-agent-service:bge-demo

  data-loop-worker:
    extends:
      file: docker-compose.native-e2e.yml
      service: writing-worker
    image: news-agent/writing-agent-service:bge-demo
    command: ["python", "-m", "app.data_loop_worker"]

  test-runner:
    image: news-agent/writing-agent-service:bge-demo

  web:
    image: news-agent/frontend:bge-demo
    build:
      context: ../frontend
      dockerfile: Dockerfile.bge-demo
    user: "101:101"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEWSAGENT_BGE_WEB_PORT:-5178}:8080"
    volumes:
      - ./bge-demo.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./bge-demo.frontend.json:/usr/share/nginx/html/config.json:ro
    networks: [native]
    restart: "on-failure:3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
