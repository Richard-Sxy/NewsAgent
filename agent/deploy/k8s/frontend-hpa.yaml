apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: news-agent-frontend
  namespace: news-agent
  labels:
    app.kubernetes.io/name: news-agent-frontend
    app.kubernetes.io/part-of: news-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: news-agent-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
