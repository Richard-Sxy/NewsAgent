apiVersion: 1
datasources:
  - name: NewsAgent Metrics
    uid: newsagent-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: newsagent-tempo
  - name: NewsAgent Logs
    uid: newsagent-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 500
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: newsagent-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: "查看完整 Trace"
  - name: NewsAgent Traces
    uid: newsagent-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: newsagent-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{$$__tags} | trace_id = "$${__span.traceId}"'
