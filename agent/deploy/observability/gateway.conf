# Only this non-root gateway reaches the ingress bridge. Backends have no egress.
# Fixed proxy targets only; no arbitrary forward-proxy or access-log body/URL capture.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_max_body_size 4m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  proxy_read_timeout 90s;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  server {
    listen 4318;
    location = /v1/traces { proxy_pass http://otel-collector:4318; }
    location = /v1/metrics { proxy_pass http://otel-collector:4318; }
    location = /v1/logs { proxy_pass http://otel-collector:4318; }
    location / { return 404; }
  }
  server { listen 3200; location / { proxy_pass http://tempo:3200; } }
  server { listen 3100; location / { proxy_pass http://loki:3100; } }
  server { listen 9090; location / { proxy_pass http://prometheus:9090; } }
  server { listen 3000; location / { proxy_pass http://grafana:3000; } }
}
