# Local development bridge only. No secret, dynamic proxy target or general API.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 32;
}

http {
    access_log off;
    server_tokens off;
    gzip off;
    client_max_body_size 256k;
    client_body_buffer_size 8k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 6s;
    client_body_timeout 6s;
    send_timeout 6s;
    keepalive_timeout 0;

    upstream fixed_analysis {
        zone fixed_analysis 32k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 1s;
        server analysis-service:8100 resolve;
    }

    server {
        listen 8080;
        server_name _;
        default_type application/json;
        error_page 413 = @input_limit;

        # Stream bodies immediately into the service's five-second absolute
        # request budget, including chunked transfer under upstream HTTP/1.1.
        # Nginx six-second read/write values are idle timeouts, not a total one.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 1s;
        proxy_send_timeout 6s;
        proxy_read_timeout 6s;
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        proxy_redirect off;
        proxy_set_header Host analysis-service;
        proxy_set_header Connection close;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";

        if ($request_uri ~ "[?]") { return 404 '{"error_code":"unknown_route","retryable":false}'; }

        location = /health {
            if ($request_method != GET) { return 405 '{"error_code":"invalid_request","retryable":false}'; }
            proxy_pass http://fixed_analysis/health;
        }

        location = /v1/analyze {
            if ($request_method != POST) { return 405 '{"error_code":"invalid_request","retryable":false}'; }
            proxy_pass http://fixed_analysis/v1/analyze;
        }

        location @input_limit {
            return 413 '{"error_code":"input_limit","retryable":false}';
        }

        location / {
            return 404 '{"error_code":"unknown_route","retryable":false}';
        }
    }
}
