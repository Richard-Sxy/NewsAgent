# Overlay: native-e2e + this file (analysis runs in the existing isolated worker). A fresh project and
# immutable warehouse identity keep existing demonstrations reproducible.
name: news-agent-timeline-demo

services:
  postgres:
    ports: !override ["127.0.0.1:25482:5432"]
  temporal:
    ports: !override ["127.0.0.1:27283:7233"]
  minio:
    ports: !override ["127.0.0.1:29500:9000", "127.0.0.1:29501:9001"]
  migrate:
    image: news-agent/writing-agent-service:timeline-demo
  api:
    image: news-agent/writing-agent-service:timeline-demo
    ports: !override ["127.0.0.1:28050:8000"]
    environment:
      SQL_ASSISTANT_DATASET_PROFILE: timeline-v4
      SQL_ASSISTANT_NEWS_PER_TENANT: ${SQL_ASSISTANT_NEWS_PER_TENANT:-1200}
      SQL_ASSISTANT_SCENARIOS_PATH: deploy/text2sql-scenes.timeline-v4.yml
  hot-news-worker:
    image: news-agent/writing-agent-service:timeline-demo
    environment:
      SQL_ASSISTANT_DATASET_PROFILE: timeline-v4
      SQL_ASSISTANT_NEWS_PER_TENANT: ${SQL_ASSISTANT_NEWS_PER_TENANT:-1200}
      SQL_ASSISTANT_SCENARIOS_PATH: deploy/text2sql-scenes.timeline-v4.yml
  writing-worker:
    image: news-agent/writing-agent-service:timeline-demo
  outbox-worker:
    image: news-agent/writing-agent-service:timeline-demo
  data-loop-worker:
    extends:
      file: docker-compose.native-e2e.yml
      service: writing-worker
    image: news-agent/writing-agent-service:timeline-demo
    command: ["python", "-m", "app.data_loop_worker"]
  test-runner:
    image: news-agent/writing-agent-service:timeline-demo

# Size is frozen at first initialization. To select another tier, create a
# different Compose project with separate volumes and free loopback ports.
