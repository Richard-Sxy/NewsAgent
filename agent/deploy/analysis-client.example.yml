# Merge into an approved API environment; secrets are injected separately.
# Production uses HTTPS with a trusted CA. Never mount a Docker socket in the API.
CONVERSATION_DATA_ANALYSIS_ENABLED: "1"
DATA_ANALYSIS_BACKEND: service
DATA_ANALYSIS_SERVICE_URL: https://newsagent-analysis.internal:8100/v1/analyze
# DATA_ANALYSIS_SERVICE_TOKEN: injected from a separately managed Secret
DATA_ANALYSIS_SERVICE_ALLOW_INSECURE_HTTP: "0"
DATA_ANALYSIS_SERVICE_REQUIRE_OS_LIMITS: "1"
DATA_ANALYSIS_TIMEOUT_SECONDS: "6"
DATA_ANALYSIS_MAX_ROWS: "200"
DATA_ANALYSIS_MAX_INPUT_BYTES: "262144"
DATA_ANALYSIS_MAX_OUTPUT_BYTES: "262144"
DATA_ANALYSIS_MAX_CONCURRENCY: "2"
DATA_ANALYSIS_MEMORY_MB: "128"
