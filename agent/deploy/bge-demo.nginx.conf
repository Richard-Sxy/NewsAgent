# Local isolated demo gateway. Compose publishes this server on loopback only.
# These identities and the token are public synthetic fixtures, never enterprise
# credentials. Incoming identity headers are replaced at this trusted boundary.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /config.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        # Docker DNS resolves the one fixed upstream again after API recreation.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $bge_demo_api http://api:8000;
        proxy_pass $bge_demo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer newsagent-native-local-token-not-for-production";
        proxy_set_header X-Tenant-ID "11111111-1111-4111-8111-111111111111";
        proxy_set_header X-User-ID "22222222-2222-4222-8222-222222222222";
        proxy_set_header X-Hot-News-Roles "hot-news:admin";
        proxy_set_header X-Writing-Roles "writing:admin";
        proxy_set_header X-Data-Loop-Roles "data-loop:admin";
        proxy_set_header X-Memory-Roles "memory:read,memory:write";
        proxy_set_header X-Team-ID "";
        proxy_set_header X-Section-ID "";
        proxy_set_header X-Role-ID "";

        # A disconnected chat POST must not be replayed by the proxy.
        proxy_next_upstream off;
        proxy_next_upstream_tries 1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        send_timeout 180s;
        add_header X-Accel-Buffering "no" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
