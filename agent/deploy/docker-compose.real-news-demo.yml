# Add last: native-e2e -> bge-snapshot -> bge-demo -> conversation-hooks-bge-demo.
# A new project gives this dataset independent PostgreSQL/Temporal history.
name: news-agent-real-news-demo

x-real-news-environment: &real-news-environment
  PYTHONDONTWRITEBYTECODE: "1"
  SQL_ASSISTANT_DATASET_PROFILE: corpus-v6
  SQL_ASSISTANT_NEWS_PER_TENANT: "120"
  SQL_ASSISTANT_SCENARIOS_PATH: /app/deploy/text2sql-scenes.corpus-v6.yml
  MODEL_RUNTIME_CONFIG_PATH: /app/deploy/conversation-hooks.model-runtime.local.yml

x-real-news-volumes: &real-news-volumes
  - ../app:/app/app:ro
  - ../examples:/app/examples:ro
  - ../docs:/app/docs:ro
  - ../data:/app/data:ro
  - ./text2sql-scenes.corpus-v6.yml:/app/deploy/text2sql-scenes.corpus-v6.yml:ro
  - ./conversation-hooks.model-runtime.local.yml:/app/deploy/conversation-hooks.model-runtime.local.yml:ro

x-real-news-runtime: &real-news-runtime
  image: news-agent/conversation-hooks-bge-demo:local
  pull_policy: never
  environment: *real-news-environment
  volumes: *real-news-volumes

services:
  migrate:
    <<: *real-news-runtime
    build: !reset null
    volumes:
      - ../app:/app/app:ro
      - ../examples:/app/examples:ro
      - ../docs:/app/docs:ro
      - ../data:/app/data:ro
      - ../alembic:/app/alembic:ro
      - ./text2sql-scenes.corpus-v6.yml:/app/deploy/text2sql-scenes.corpus-v6.yml:ro
      - ./conversation-hooks.model-runtime.local.yml:/app/deploy/conversation-hooks.model-runtime.local.yml:ro

  api:
    <<: *real-news-runtime
    ports: !override ["127.0.0.1:${NEWSAGENT_REAL_API_PORT:-28070}:8000"]
    healthcheck:
      start_period: 300s

  hot-news-worker:
    <<: *real-news-runtime

  writing-worker:
    <<: *real-news-runtime

  outbox-worker:
    <<: *real-news-runtime

  data-loop-worker:
    <<: *real-news-runtime

  test-runner:
    <<: *real-news-runtime
    volumes:
      - ../app:/app/app:ro
      - ../examples:/app/examples:ro
      - ../docs:/app/docs:ro
      - ../data:/app/data:ro
      - ../tests:/app/tests:ro
      - ./text2sql-scenes.corpus-v6.yml:/app/deploy/text2sql-scenes.corpus-v6.yml:ro
      - ./conversation-hooks.model-runtime.local.yml:/app/deploy/conversation-hooks.model-runtime.local.yml:ro

  web:
    image: news-agent/frontend:real-news-demo
    pull_policy: never
    build:
      context: ../frontend/dist
      dockerfile: ../Dockerfile.conversation-hooks.cached
      network: none
      args:
        WEB_RUNTIME_IMAGE: news-agent/frontend:conversation-hooks-demo
    ports: !override ["127.0.0.1:${NEWSAGENT_REAL_WEB_PORT:-5179}:8080"]
