<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NewsAgent 运营资料包</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#15211d;background:#eef2ef;--ink:#15211d;--muted:#64716b;--green:#075e45;--lime:#d7f56b;--line:#d9e0dc;--paper:#fbfcfa;--warn:#fff4d6;--danger:#fff0ed}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#e7efe9 0,#f4f3ed 48%,#eaf0ed 100%);min-height:100vh}
    header{background:#10271f;color:white;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4;box-shadow:0 8px 24px #10271f24}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em}.mark{width:34px;height:34px;border-radius:10px;background:var(--lime);color:#173126;display:grid;place-items:center}
    .header-note{color:#b8c7c0;font-size:13px}.shell{width:min(1320px,calc(100% - 40px));margin:28px auto 64px}
    .toolbar,.hero,.panel{background:rgba(251,252,250,.96);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 35px #213b3020}
    .toolbar{padding:16px;display:grid;grid-template-columns:1.2fr 1.2fr auto auto;gap:12px;align-items:end}
    label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}input{border:1px solid #bdc9c3;border-radius:9px;padding:11px 12px;background:white;font:inherit;color:var(--ink)}
    button,.button{border:0;border-radius:9px;padding:11px 16px;background:var(--green);color:white;font-weight:750;cursor:pointer;text-decoration:none;text-align:center}button.secondary{background:#e5ebe7;color:#26443a}button:disabled{opacity:.55;cursor:wait}
    #message{min-height:22px;margin:10px 4px;color:var(--green);font-size:13px}.error{color:#b42318!important}
    .hero{padding:28px;margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:24px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:34px;line-height:1.18;margin:8px 0 12px;max-width:800px}.hero p{color:var(--muted);margin:0;max-width:780px;line-height:1.7}
    .quality{width:180px;display:grid;place-items:center;text-align:center;background:#eff7df;border-radius:14px;padding:18px}.quality strong{display:block;font-size:38px;color:var(--green)}
    .metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0}.metric{background:#18352b;color:white;border-radius:13px;padding:16px}.metric span{display:block;color:#b9c9c2;font-size:12px}.metric strong{display:block;font-size:24px;margin-top:7px}.metric.attention{background:#775b16}
    .layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,.85fr);gap:12px}.panel{padding:22px;margin-bottom:12px}.panel h2{margin:0 0 16px;font-size:19px}.section-note{font-size:13px;color:var(--muted);font-weight:400}
    .fact{padding:17px 0;border-top:1px solid var(--line)}.fact:first-of-type{border-top:0;padding-top:0}.fact-head{display:flex;gap:10px;align-items:flex-start}.id{font:700 12px ui-monospace,monospace;background:#e2eee8;color:var(--green);border-radius:6px;padding:4px 7px;white-space:nowrap}.fact h3{font-size:16px;margin:1px 0 8px}.fact p{margin:0;color:#4f5e57;line-height:1.65}.source{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}.source a{color:var(--green);font-weight:700}.confidence{margin-left:auto;background:#edf5d6;color:#49600b;border-radius:20px;padding:3px 8px}
    .timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#bdd0c6}.event{position:relative;margin:0 0 20px}.event:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #dce9e2}.event time{font-size:12px;color:var(--green);font-weight:800}.event p{margin:5px 0;color:#4f5e57;line-height:1.55}
    .alert{border-radius:11px;padding:14px;margin-top:10px;background:var(--warn);border-left:4px solid #d29b16}.alert.danger{background:var(--danger);border-color:#d24b36}.alert strong{display:block;margin-bottom:5px}.alert p{margin:0;color:#5d5540;line-height:1.55;font-size:14px}.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:3px 8px;background:#efd58c;margin-right:6px}
    .angle{border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:10px}.angle h3{margin:0 0 6px;font-size:15px}.angle p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.refs{margin-top:8px;font:12px ui-monospace,monospace;color:var(--green)}
    .empty{padding:24px;text-align:center;color:var(--muted);background:#f4f6f4;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}[hidden]{display:none!important}
    @media(max-width:960px){.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.quality{width:100%}}
    @media(max-width:620px){.shell{width:min(100% - 20px,1320px);margin-top:12px}.toolbar{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}.header-note{display:none}}
  </style>
</head>
<body>
<header><div class="brand"><span class="mark">N</span> NewsAgent · 运营资料包</div><div class="header-note">事实可追溯 · 冲突可见 · 决策在人</div></header>
<main class="shell">
  <section class="toolbar">
    <label>任务 ID<input id="jobId" placeholder="Job UUID"></label>
    <label>租户 ID<input id="tenantId" placeholder="Tenant UUID"></label>
    <button id="load">加载资料包</button><button class="secondary" id="demo">查看演示</button>
  </section>
  <div id="message" aria-live="polite"></div>
  <div id="workspace" hidden>
    <section class="hero"><div><div class="eyebrow">Research package</div><h1 id="topic">-</h1><p>为运营研判提供的结构化事实底稿。优先处理“证据冲突”和“待核实问题”，再决定是否进入选题或写作。</p><div class="actions"><button id="markdown">导出 Markdown</button><button class="secondary" id="json">导出 JSON</button></div></div><div class="quality">资料可用度<strong id="quality">--</strong><small>参考值，不代替人工判断</small></div></section>
    <section class="metrics" id="metrics"></section>
    <div class="layout"><div><section class="panel"><h2>关键事实 <span class="section-note">每条事实均可返回原始来源</span></h2><div id="facts"></div></section><section class="panel"><h2>事件时间线</h2><div class="timeline" id="timeline"></div></section></div><aside><section class="panel"><h2>证据冲突</h2><div id="conflicts"></div></section><section class="panel"><h2>待核实问题</h2><div id="gaps"></div></section><section class="panel"><h2>候选选题角度</h2><div id="angles"></div></section></aside></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);let current=null;
const demo={job_id:"demo",topic:"生成式 AI 如何改变新闻生产流程",facts:[{fact_id:"F001",claim:"新闻编辑部将 AI 用于资料整理与辅助写作",evidence:"公开案例表明，AI 主要用于检索、摘要、标题建议和初稿辅助，发布仍由编辑把关。",source_url:"https://example.com/source/1",source_title:"权威来源示例",published_at:"2026-08-30T09:00:00+08:00",confidence:.94},{fact_id:"F002",claim:"可追溯引用是运营采纳的关键条件",evidence:"运营人员需要能从结论返回原文，并快速识别待核实内容。",source_url:"https://example.com/source/2",source_title:"内部调研示例",published_at:"2026-08-29T16:30:00+08:00",confidence:.86}],timeline:[{event_id:"T001",occurred_at:"2026-08-29T16:30:00+08:00",description:"完成运营需求调研，确定资料包是第一优先交付物。",supporting_fact_ids:["F002"]},{event_id:"T002",occurred_at:"2026-08-30T09:00:00+08:00",description:"形成检索、事实整理和人工审批闭环。",supporting_fact_ids:["F001","F002"]}],conflicts:[{conflict_id:"C001",fact_ids:["F001","F002"],description:"自动化效率目标与编辑事实审核成本之间存在权衡。",resolution:null}],evidence_gaps:[{gap_id:"G001",question:"真实运营任务中，资料准备时间可以缩短多少？",importance:"high",suggested_query:"采集上线前后的任务耗时与采纳数据"}],suggested_angles:[{angle_id:"A001",title:"从“会生成”到“可信任”",rationale:"聚焦证据链、人工门禁与局部返工，而不是强调 Agent 数量。",supporting_fact_ids:["F001","F002"]}],metrics:{fact_count:2,unique_source_count:2,numeric_fact_count:0,citation_coverage_percent:100,average_confidence:.9,timeline_event_count:2,conflict_count:1,evidence_gap_count:1,angle_count:1}};
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function empty(text){return `<div class="empty">${esc(text)}</div>`}function date(v){return v?new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'时间未提供'}
function render(p){current=p;$('workspace').hidden=false;$('topic').textContent=p.topic;const m=p.metrics||{};const score=Math.max(0,Math.min(100,Math.round((m.citation_coverage_percent||0)*.45+(m.average_confidence||0)*100*.35+Math.max(0,20-(m.evidence_gap_count||0)*8-(m.conflict_count||0)*5))));$('quality').textContent=score;const defs=[['fact_count','可追溯事实'],['unique_source_count','独立来源'],['citation_coverage_percent','引用覆盖','%'],['average_confidence','平均置信度','confidence'],['conflict_count','证据冲突','attention'],['evidence_gap_count','待核实','attention']];$('metrics').innerHTML=defs.map(([k,l,t])=>`<div class="metric ${t==='attention'&&m[k]?'attention':''}"><span>${l}</span><strong>${t==='%'?(m[k]??0)+'%':t==='confidence'?Math.round((m[k]||0)*100)+'%':m[k]??0}</strong></div>`).join('');
$('facts').innerHTML=p.facts.length?p.facts.map(f=>`<article class="fact"><div class="fact-head"><span class="id">${esc(f.fact_id)}</span><div><h3>${esc(f.claim)}</h3><p>${esc(f.evidence)}</p></div></div><div class="source"><span>${date(f.published_at)}</span><a href="${esc(f.source_url)}" target="_blank" rel="noopener">${esc(f.source_title)} ↗</a><span class="confidence">${Math.round(f.confidence*100)}% 置信</span></div></article>`).join(''):empty('暂无可追溯事实');
$('timeline').innerHTML=p.timeline.length?p.timeline.map(e=>`<div class="event"><time>${date(e.occurred_at)}</time><p>${esc(e.description)}</p><span class="id">${esc(e.supporting_fact_ids.join(' · '))}</span></div>`).join(''):empty('暂无时间线');
$('conflicts').innerHTML=p.conflicts.length?p.conflicts.map(c=>`<div class="alert danger"><strong>${esc(c.conflict_id)} · ${esc(c.fact_ids.join(' / '))}</strong><p>${esc(c.description)}<br>处理：${esc(c.resolution||'待运营核实')}</p></div>`).join(''):empty('未发现证据冲突');
$('gaps').innerHTML=p.evidence_gaps.length?p.evidence_gaps.map(g=>`<div class="alert"><strong><span class="tag">${esc(g.importance.toUpperCase())}</span>${esc(g.gap_id)}</strong><p>${esc(g.question)}${g.suggested_query?'<br><br>建议：'+esc(g.suggested_query):''}</p></div>`).join(''):empty('暂无待核实问题');
$('angles').innerHTML=p.suggested_angles.length?p.suggested_angles.map(a=>`<div class="angle"><h3>${esc(a.title)}</h3><p>${esc(a.rationale)}</p><div class="refs">${esc(a.supporting_fact_ids.join(' · '))}</div></div>`).join(''):empty('暂无候选角度');}
async function load(){const id=$('jobId').value.trim(),tenant=$('tenantId').value.trim();if(!id||!tenant)return msg('请填写任务 ID 和租户 ID。',true);try{const r=await fetch(`/api/v1/jobs/${encodeURIComponent(id)}/research-package`,{headers:{'X-Tenant-ID':tenant}}),p=await r.json();if(!r.ok)throw new Error(p.detail||`HTTP ${r.status}`);render(p);localStorage.setItem('newsAgentTenantId',tenant);msg('已加载最新资料包。')}catch(e){msg(e.message,true)}}
function msg(t,e=false){$('message').textContent=t;$('message').className=e?'error':''}async function download(format){if(!current)return;const id=$('jobId').value.trim(),tenant=$('tenantId').value.trim();if(id&&tenant&&current!==demo){const r=await fetch(`/api/v1/jobs/${encodeURIComponent(id)}/research-package/export?format=${format}`,{headers:{'X-Tenant-ID':tenant}});if(!r.ok)return msg(`导出失败：HTTP ${r.status}`,true);const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`research-package-${id}.${format==='markdown'?'md':'json'}`;a.click();URL.revokeObjectURL(u)}else{const b=new Blob([JSON.stringify(current,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='research-package-demo.json';a.click();URL.revokeObjectURL(u)}}
$('load').onclick=load;$('demo').onclick=()=>{render(demo);msg('当前为演示数据，用于评审布局与交互。')};$('markdown').onclick=()=>download('markdown');$('json').onclick=()=>download('json');const q=new URLSearchParams(location.search);$('jobId').value=q.get('job_id')||'';$('tenantId').value=q.get('tenant_id')||localStorage.getItem('newsAgentTenantId')||'';if(q.get('demo')==='1')$('demo').click();else if($('jobId').value&&$('tenantId').value)load();
</script>
</body>
</html>
