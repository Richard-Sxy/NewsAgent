server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    # 带内容哈希的构建产物可以长期缓存。
    # 注意：nginx 的 add_header 不会被子级 location 继承，因此安全头在每处重复声明。
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 运行时配置由 ConfigMap 覆盖，绝不缓存，否则发版后仍读旧配置。
    location = /config.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # SPA 路由回退；index.html 不缓存，保证发布后立即生效。
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # 前端容器不代理 /api。
    # 后端路由由 Ingress 直接指向 API Service，身份头只在网关一处注入，
    # 避免在两跳代理之间出现可被篡改的中间层。
    #
    # 本地 docker-compose 联调需要同源时，可把下面这段替换掉上面的 location /api/：
    #
    # location /api/ {
    #     proxy_pass http://api:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_buffering off;          # SSE 必须关闭缓冲
    #     proxy_read_timeout 3600s;
    # }
    location /api/ {
        return 404;
    }
}
