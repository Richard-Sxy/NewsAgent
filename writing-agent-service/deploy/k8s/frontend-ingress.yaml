# 两个 Ingress 共用同一个 host，交给 ingress-nginx 按最长前缀合并到同一个 server 块。
#
# 为什么要拆开：
#   /api 需要"鉴权 + 剥离客户端身份头 + 注入网关身份头"，而静态资源只需要"鉴权"。
#   ingress-nginx 的 configuration-snippet / proxy-set-headers 是 Ingress 级别注解，
#   混在一个 Ingress 里会让静态资源路由也套上 API 的那套重写规则。
#
# 前置条件（本项目尚未提供，需要按实际环境补齐）：
#   1. 上游 SSO / oauth2-proxy 网关，暴露 auth-url 与 auth-signin 两个端点；
#      auth-url 校验通过时必须返回 X-Tenant-ID / X-User-ID / X-Data-Loop-Roles 三个响应头。
#   2. 后端 API 的 K8s Service，名称与本文件中 `writing-agent-api` 保持一致。
#      当前仓库只有 docker compose 的 `api` 服务，K8s 侧需要单独部署同一镜像。
#   3. 网关共享 Token 通过 ConfigMap 注入请求头，不要写进 Ingress 注解：
#        kubectl -n news-agent create configmap gateway-request-headers \
#          --from-literal=Authorization="Bearer ${DATA_LOOP_GATEWAY_TOKEN}"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: news-agent-web
  namespace: news-agent
  labels:
    app.kubernetes.io/part-of: news-agent
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # 未登录用户在校验阶段就被重定向到 SSO，连 SPA 外壳都不下发。
    nginx.ingress.kubernetes.io/auth-url: 'https://sso.internal.example/oauth2/auth'
    nginx.ingress.kubernetes.io/auth-signin: 'https://sso.internal.example/oauth2/start?rd=$escaped_request_uri'
    cert-manager.io/cluster-issuer: internal-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - news-agent.internal.example
      secretName: news-agent-tls
  rules:
    - host: news-agent.internal.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: news-agent-frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: news-agent-api
  namespace: news-agent
  labels:
    app.kubernetes.io/part-of: news-agent
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/auth-url: 'https://sso.internal.example/oauth2/auth'
    nginx.ingress.kubernetes.io/auth-signin: 'https://sso.internal.example/oauth2/start?rd=$escaped_request_uri'
    # 把 auth-url 返回的身份头透传给上游 FastAPI。
    # 后端 app/api/dependencies.py 正是从这三个头 + Authorization 构造 Principal。
    nginx.ingress.kubernetes.io/auth-response-headers: 'X-Tenant-ID,X-User-ID,X-Data-Loop-Roles'
    # 静态注入网关共享 Token（来源见文件头的 ConfigMap 说明）。
    nginx.ingress.kubernetes.io/proxy-set-headers: 'news-agent/gateway-request-headers'
    # 先清掉客户端伪造的同名头，再接受 auth-response-headers 注入的值。
    # 这一步是安全前提：否则任何浏览器都能自称任意租户。
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_input_headers "X-Tenant-ID" "X-User-ID" "X-Data-Loop-Roles";
      more_clear_input_headers "Authorization" "X-Forwarded-User" "X-Forwarded-Tenant";
    # SSE 进度流必须关闭缓冲，否则事件会被积压到连接结束。
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-body-size: '2m'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - news-agent.internal.example
      secretName: news-agent-tls
  rules:
    - host: news-agent.internal.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: writing-agent-api
                port:
                  name: http
