name: news-agent-data-loop-e2e

# Disposable, hermetic acceptance stack. Every credential below is deliberately
# local-only; never reuse this file as a production deployment definition.

x-runtime-manifest: &runtime-manifest >-
  [{"metric_definition_version":"e2e-metrics-v1","hot_score_policy_version":"e2e-hot-score-v1","reranker_policy_version":"e2e-reranker-v1","analysis_prompt_version":"e2e-analysis-prompt-v1","fastgpt_app_id":"e2e-hot-news-app-v1","model_version":"e2e-model-v1","output_schema_version":"e2e-output-schema-v1","validator_version":"e2e-validator-v1","memory_resolver_policy_version":"e2e-memory-resolver-v1"},{"metric_definition_version":"e2e-metrics-v1","hot_score_policy_version":"e2e-hot-score-v1","reranker_policy_version":"e2e-reranker-v1","analysis_prompt_version":"e2e-analysis-prompt-v2","fastgpt_app_id":"e2e-hot-news-app-v2","model_version":"e2e-model-v2","output_schema_version":"e2e-output-schema-v1","validator_version":"e2e-validator-v1","memory_resolver_policy_version":"e2e-memory-resolver-v1"}]

x-app-env: &app-env
  ENVIRONMENT: e2e
  DATABASE_URL: postgresql+psycopg://newsagent_e2e:newsagent_e2e@postgres:5432/newsagent_e2e
  REDIS_URL: redis://redis:6379/0
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: news-writing
  TEMPORAL_HOT_NEWS_TASK_QUEUE: hot-news
  TEMPORAL_DATA_LOOP_TASK_QUEUE: hot-news-data-loop
  DATA_LOOP_REPLAY_MAX_CONCURRENCY: "4"
  DATA_LOOP_MAX_CASES_PER_COHORT: "20"
  DATA_LOOP_GATEWAY_TOKEN: newsagent-e2e-gateway-token-not-for-production
  FASTGPT_BASE_URL: http://fastgpt-stub:3000
  FASTGPT_API_KEY: newsagent-e2e-fastgpt-key
  FASTGPT_DATASET_ID: ""
  FASTGPT_RESEARCH_APP_ID: e2e-unused-research-app
  FASTGPT_WRITER_APP_ID: e2e-unused-writer-app
  FASTGPT_REVIEWER_APP_ID: e2e-unused-reviewer-app
  FASTGPT_HOT_NEWS_APP_ID: e2e-hot-news-app-v1
  FASTGPT_ERROR_ATTRIBUTION_APP_ID: ""
  HOT_NEWS_RUNTIME_MANIFEST_JSON: *runtime-manifest
  ARTIFACT_BUCKET: newsagent-e2e-artifacts
  ARTIFACT_ENDPOINT: http://minio:9000
  ARTIFACT_REGION: us-east-1
  ARTIFACT_PREFIX: newsagent-e2e
  ARTIFACT_SSE_ALGORITHM: none
  AWS_ACCESS_KEY_ID: newsagent-e2e-minio
  AWS_SECRET_ACCESS_KEY: newsagent-e2e-minio-secret
  AWS_EC2_METADATA_DISABLED: "true"

x-app-service: &app-service
  image: news-agent/writing-agent-service:e2e
  environment: *app-env
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks: [e2e]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newsagent_e2e
      POSTGRES_PASSWORD: newsagent_e2e
      POSTGRES_DB: newsagent_e2e
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - writing-postgres-data:/var/lib/postgresql/data
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsagent_e2e -d newsagent_e2e"]
      interval: 3s
      timeout: 3s
      retries: 30

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 3s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "127.0.0.1:17233:7233"
    networks: [e2e]
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - temporal:7233
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:18233:8080"
    networks: [e2e]

  redis:
    image: redis:7-alpine
    networks: [e2e]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: newsagent-e2e-minio
      MINIO_ROOT_PASSWORD: newsagent-e2e-minio-secret
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    networks: [e2e]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 newsagent-e2e-minio
        newsagent-e2e-minio-secret &&
        mc mb --ignore-existing local/newsagent-e2e-artifacts &&
        mc version enable local/newsagent-e2e-artifacts
    networks: [e2e]

  fastgpt-stub:
    <<: *app-service
    command:
      - uvicorn
      - examples.fastgpt_e2e_stub:app
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app-service
    build:
      context: ..
      dockerfile: Dockerfile.e2e
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:18000:8000"
    restart: "on-failure:3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  data-loop-worker:
    <<: *app-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fastgpt-stub:
        condition: service_healthy
    command: ["python", "-m", "app.data_loop_worker"]
    restart: "on-failure:3"

  hot-news-worker:
    <<: *app-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      fastgpt-stub:
        condition: service_healthy
    command: ["python", "-m", "examples.hot_news_e2e_worker"]
    restart: "on-failure:3"

  e2e-runner:
    <<: *app-service
    profiles: [runner]
    depends_on:
      api:
        condition: service_healthy
      data-loop-worker:
        condition: service_started
      hot-news-worker:
        condition: service_started
    environment:
      <<: *app-env
      DATA_LOOP_E2E_API_URL: http://api:8000
      FASTGPT_E2E_STUB_URL: http://fastgpt-stub:3000
      PYTEST_ADDOPTS: -o cache_dir=/tmp/.pytest_cache
    volumes:
      - e2e-state:/state
    entrypoint: ["python", "-m", "examples.data_loop_e2e"]
    command: ["--help"]

volumes:
  writing-postgres-data:
  temporal-postgres-data:
  minio-data:
  e2e-state:

networks:
  e2e:
