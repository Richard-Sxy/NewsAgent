# 仅为字段模板，不被 kustomization 引用。真实值由企业密钥系统创建/同步。
# 不要把填过真实值的本文件提交 Git；DSN 中特殊字符需做 URL 编码。
apiVersion: v1
kind: Secret
metadata:
  name: newsagent-secrets
  namespace: news-agent
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://replace-me:replace-me@postgres.example.invalid:5432/newsagent?sslmode=require
  REDIS_URL: rediss://default:replace-me@redis.example.invalid:6379/0
  ENTERPRISE_MODEL_API_KEY: replace-me
  ENTERPRISE_EMBEDDING_API_KEY: replace-me
  DATA_LOOP_GATEWAY_TOKEN: replace-me
  KNOWLEDGE_INGEST_TOKEN: replace-me
  # boto3 的 S3 兼容凭据；使用已验证的工作负载身份时移除这两项。
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
  # AWS_SESSION_TOKEN: 从企业临时凭据系统注入
  # CMS_PUBLISH_TOKEN: 完成 CMS 联调后注入
