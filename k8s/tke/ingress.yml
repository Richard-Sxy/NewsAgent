# 可选：已有 CLB + 同命名空间企业鉴权 Gateway。
# 填好 CLB/域名/TLS、接入真实 Gateway 后，在基础清单之上单独 apply -k k8s/tke。
# 使用标准 NodePort 后端；TKE VPC-CNI 直连模式需另按平台要求调整。
apiVersion: v1
kind: Service
metadata:
  name: newsagent-frontend-ingress
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: newsagent-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: newsagent-gateway
spec:
  type: NodePort
  # 由企业网关团队对齐真实 Pod 标签和端口；本仓库不创建假网关。
  selector: {app.kubernetes.io/name: newsagent-gateway}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: newsagent
  annotations:
    kubernetes.io/ingress.class: qcloud
    # 复用现有 CLB 应使用 existLbId；qcloud-loadbalance-id 是控制器只读回填项。
    kubernetes.io/ingress.existLbId: lb-replace-me
    ingress.cloud.tencent.com/direct-access: "false"
spec:
  tls:
    - hosts: [newsagent.example.invalid]
      secretName: newsagent-tls
  rules:
    - host: newsagent.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: newsagent-gateway, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: newsagent-frontend-ingress, port: {name: http}}
