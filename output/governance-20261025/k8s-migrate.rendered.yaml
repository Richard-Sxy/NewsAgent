apiVersion: batch/v1
kind: Job
metadata:
  name: newsagent-migrate
  namespace: news-agent
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newsagent-migrate
        app.kubernetes.io/part-of: newsagent
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - alembic
        - upgrade
        - head
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: newsagent-migration-secrets
        image: registry.example.invalid/newsagent/api:replace-me
        name: migrate
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        workingDir: /app
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
  ttlSecondsAfterFinished: 86400
