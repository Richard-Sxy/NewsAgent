apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsagent-api
  namespace: news-agent
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: newsagent-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newsagent-api
        app.kubernetes.io/part-of: newsagent
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --timeout-graceful-shutdown
        - "45"
        envFrom:
        - configMapRef:
            name: newsagent-settings-77827d8225
        - secretRef:
            name: newsagent-secrets
        image: registry.example.invalid/newsagent/api:replace-me
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - import time; time.sleep(5)
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        name: api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /etc/newsagent/runtime
          name: runtime
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: newsagent
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: newsagent-api
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: newsagent-runtime-dc7b927g9c
        name: runtime
      - emptyDir:
          sizeLimit: 128Mi
        name: tmp
